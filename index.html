<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SetDex</title>
<meta name="description" content="Track your Pokémon TCG collection set by set and see what it is worth.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src https://api.tcgdex.net https://api.frankfurter.dev https://api.frankfurter.app https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#141A26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SetDex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:"Outfit";font-weight:400;font-display:swap;src:url(fonts/outfit-400.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:500;font-display:swap;src:url(fonts/outfit-500.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:600;font-display:swap;src:url(fonts/outfit-600.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:700;font-display:swap;src:url(fonts/outfit-700.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:800;font-display:swap;src:url(fonts/outfit-800.woff2) format("woff2")}
:root{
  color-scheme:light;
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --line:#DCE0E8;
  --ink:#141A26; --ink-2:#4A5468; --ink-3:#8590A3;
  --accent:#E3350D; --accent-soft:#FDE6E0; --good:#16925F; --good-soft:#DDF3E9;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 6px 18px rgba(20,26,38,.07);
  --r:14px;
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0E1118; --surface:#171B25; --surface-2:#202533; --line:#2B3140;
    --ink:#EEF1F7; --ink-2:#A9B2C3; --ink-3:#6F7A8D;
    --accent:#FF5A36; --accent-soft:#3A1E18; --good:#3CCB8E; --good-soft:#123227;
    --shadow:0 1px 0 rgba(255,255,255,.03);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
img{display:block}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;white-space:nowrap;font-size:14px}
nav a.on{background:var(--ink);color:var(--bg)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}

/* generic */
h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.input{width:100%;border:1px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:12px;outline:none}
.input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.done i{background:var(--good)}
.center{padding:60px 0;text-align:center;color:var(--ink-2)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* sets list */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.toolbar .input{flex:1;min-width:200px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.setc{display:flex;flex-direction:column;gap:8px;padding:12px;text-decoration:none}
.setc:hover{border-color:var(--ink-3)}
.setc .logo{height:54px;display:flex;align-items:center;justify-content:center}
.setc .logo img{max-height:54px;max-width:100%;object-fit:contain}
.setc .logo .ph{font-weight:800;color:var(--ink-3);font-size:22px;letter-spacing:.04em;text-align:center}
.setc .nm{font-weight:600;font-size:14px;line-height:1.2;min-height:2.4em}
.grid .sec{grid-column:1/-1;font-weight:700;color:var(--ink-2);margin-top:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.setc .incl{font-size:12px;font-weight:600;color:var(--accent);margin-top:2px}
.setc .logo img.cover{height:54px;width:auto;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 14px;text-decoration:none;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab span{font-size:12px;color:var(--ink-3);font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.setc .incl{cursor:pointer}
.setc .incl:hover{text-decoration:underline}
.note{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.syncst{font-size:12px;font-weight:600;color:var(--ink-3);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:5px}
.syncst::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.syncst.ok::before{background:var(--good)} .syncst.busy::before{background:#E0A100} .syncst.err{color:var(--accent)} .syncst.err::before{background:var(--accent)}
@media (max-width:480px){.syncst span{display:none}}
.guide{border:1px solid var(--line);border-radius:12px;padding:4px 14px;background:var(--surface-2)}
.guide summary{cursor:pointer;font-weight:700;padding:8px 0}
.gstep{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.gstep p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.gn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.glist{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2);display:grid;gap:4px}
.gtips{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.guide code{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:13px}
.tile .art{position:relative}
.tile .flags{position:absolute;left:6px;bottom:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;pointer-events:none}
.fl{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.fl.t{background:#2F6FEB;color:#fff}.fl.w{background:#fff;color:#D6336C}
.tnote{color:var(--ink-2);font-weight:600}
.trow{display:flex;align-items:center;gap:10px;padding:6px 0 10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.trow .step{margin-left:auto}
.step.sm button{width:30px;height:30px;font-size:16px}.step.sm span{min-width:28px}
.btn.wanted{color:#D6336C;border-color:#D6336C}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.sumrow .stat{flex:1;min-width:150px}
.frow{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none}
.frow .r{margin-left:auto;text-align:right;font-size:13px;color:var(--ink-2)}
.sharebox{display:grid;gap:8px}
.qrbox{background:#fff;padding:12px;border-radius:12px;width:max-content;max-width:100%}
.qrbox svg{display:block;width:240px;height:240px}
.brand-icon{width:26px;height:26px;border-radius:7px}
@media (max-width:480px){.brand-icon{width:28px;height:28px}}
.top{padding-top:env(safe-area-inset-top)}
.sets-group{margin:22px 0 10px;font-size:15px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.sets-group::after{content:"";flex:1;height:1px;background:var(--line)}
.mark{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);min-height:20px}
.mark .sym{width:20px;height:20px;object-fit:contain}
.code{font-weight:700;font-size:11px;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.mark .yr{margin-left:auto}
.shead .logo:empty{display:none}
.shead .mark{margin-top:6px;font-size:13px}
.shead .mark .sym{width:26px;height:26px}
.noimg{flex-direction:column;gap:4px;font-weight:600}
.noimg b{font-size:18px;color:var(--ink-2)}
.setc .ct{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}

/* set head */
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink-2);font-weight:600;margin-bottom:12px}
.shead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.shead .logo{width:150px;height:70px;display:flex;align-items:center}
.shead .logo img{max-width:100%;max-height:70px;object-fit:contain}
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;margin-top:16px}
.stat{padding:14px 16px}
.stat .lb{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.stat .vl{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:13px;color:var(--ink-2);margin-top:4px}
.stat .bar{margin-top:10px}
.stat.hero .vl{font-size:30px}
@media (max-width:780px){.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat.hero{grid-column:1/-1}.stat{padding:12px}.stat:not(.hero) .vl{font-size:18px}.stat .lb{font-size:10.5px}.stat .sub{font-size:12px}}
@media (max-width:480px){.brand{font-size:0;gap:0}nav{margin-left:0}nav a{padding:7px 10px}}
.loadnote{font-size:13px;color:var(--ink-3);margin-left:auto}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
@media (max-width:480px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}}
.tile{position:relative}
.tile .art{all:unset;position:relative;cursor:pointer;display:block;border-radius:7px;overflow:hidden;aspect-ratio:245/342;background:var(--surface-2);width:100%}
.tile .art img{width:100%;height:100%;object-fit:cover;transition:filter .2s,opacity .2s}
.tile:not(.own) .art img{filter:grayscale(1);opacity:.42}
.tile .art .noimg{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;color:var(--ink-3)}
.tile .meta{display:flex;justify-content:space-between;gap:4px;font-size:12px;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .num{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .price{font-weight:600;white-space:nowrap}
.tile .vd{display:flex;gap:3px;margin-top:4px;min-height:6px}
.tile .vd i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.tile .vd i.on{background:var(--good)}
.tile .qc{position:absolute;right:6px;top:6px;display:flex;align-items:center;border-radius:999px;background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tile.own .qc{background:var(--good)}
.tile .qc button{width:30px;height:30px;border:0;background:none;color:var(--bg);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tile.own .qc button{color:#fff}
.tile .qc .cnt{min-width:14px;text-align:center;color:#fff;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.small{padding:5px 12px;font-size:13px}
.tile .sname{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* modal */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);max-width:min(760px,calc(100vw - 24px));width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,10,16,.6)}
.md{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px}
@media (max-width:620px){.md{grid-template-columns:1fr}.md .big{max-width:230px;margin:0 auto}}
.md .big{border-radius:12px;overflow:hidden;aspect-ratio:245/342;background:var(--surface-2)}
.md .big img{width:100%;height:100%;object-fit:cover}
.md h3{margin:0;font-size:22px;letter-spacing:-.02em}
.vrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow .vn{font-weight:600}
.vrow .vp{font-size:13px;color:var(--ink-2)}
.step{margin-left:auto;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--surface-2);width:36px;height:36px;font-size:18px;cursor:pointer}
.step span{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.x{position:absolute;right:10px;top:10px;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}

/* collection */
.rows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:90px 1fr 110px;gap:14px;align-items:center;padding:12px 14px;text-decoration:none}
.srow img{max-height:40px;max-width:90px;object-fit:contain}
.srow .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.srow .bar{margin-top:6px}
@media (max-width:520px){.srow{grid-template-columns:60px 1fr 80px}.srow img{max-width:60px}}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;transition:.25s;z-index:99;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.act{pointer-events:auto}
.toast .undo{margin-left:14px;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.set-form{padding:18px;display:grid;gap:14px;max-width:560px}
.set-form label{display:grid;gap:6px;font-weight:600;font-size:14px}
.foot{margin-top:40px;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/sets"><img class="brand-icon" src="icons/icon-192.png" alt="" width="26" height="26">SetDex</a>

</div></header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

  return {get, give};
}

function setQty(card, setId, v, n){
  n = Math.max(0, Math.min(999, n|0));
  let e = col.cards[card.id];
  if(!e) e = col.cards[card.id] = {s:setId, n:card.name, l:card.localId, i:card.image || "", q:{}};
  if(card.rs) e.r = card.rs;
  if(n) e.q[v] = n; else delete e.q[v];
  if(e.t){ if((e.t[v] || 0) > n){ if(n) e.t[v] = n; else delete e.t[v]; } if(!Object.keys(e.t).length) delete e.t; }

  if(n && col.wants[card.id]){ delete col.wants[card.id]; col.del["w:" + card.id] = Date.now(); }   // got it: off the wants list

/* ---------- API + caches ---------- */
async function getJSON(path){

}
async function cached(key, path, map){
  const c = lsGet(key, null);
  if(c && Date.now() - c.t < DAY) return c.d;
  try{
    const d = map(await getJSON(path));
    if(!lsSet(key, {t:Date.now(), d})){ trimCaches(); lsSet(key, {t:Date.now(), d}); }
    return d;
  }catch(e){ if(c) return c.d; throw e; }
}
let setsList = null;
async function getSets(){
  if(setsList) return setsList;
  setsList = await cached("setdex-sets", "/sets", d => d.map(s => ({id:s.id, name:s.name, logo:s.logo||"", symbol:s.symbol||"", total:s.cardCount?.total||0, official:s.cardCount?.official||0})));

}
const setMeta = id => (setsList || []).find(s => s.id === id);
const setMem = {};
async function getSet(id){
  if(setMem[id]) return setMem[id];
  const base = await getSetRaw(id);
  const parts = await Promise.all((CHILDREN[id] || []).map(c => getSetRaw(c).catch(() => null)));
  const d = Object.assign({}, base, {cards:base.cards.slice(), subs:[]});
  parts.forEach(p => {
    if(!p) return;
    d.subs.push({id:p.id, name:p.name});
    p.cards.forEach(c => d.cards.push(Object.assign({}, c, {sub:p.name, rs:p.id, part:p.id})));
  });
  (PREFIX_SUBS[id] || []).forEach(v => {
    let n = 0;
    d.cards.forEach(c => { if(!c.part && prefixPart(id, c.localId) === v){ c.sub = v.name; c.part = v.key; n++; } });
    if(n) d.subs.push({id:v.key, name:v.name});
  });
  // subset cards after the main set
  d.cards = [...d.cards.filter(c => !c.part), ...d.subs.flatMap(x => d.cards.filter(c => c.part === x.id))];
  d.total = d.cards.length;
  return setMem[id] = d;
}
async function getSetRaw(id){
  const d = await cached("setdex-set-" + id, "/sets/" + encodeURIComponent(id), s => ({
    id:s.id, name:s.name, logo:s.logo||"", symbol:s.symbol||"", serie:s.serie?.name||"", releaseDate:s.releaseDate||"",
    total:s.cardCount?.total||(s.cards||[]).length, official:s.cardCount?.official||0,

}
/* card total for a main set including its subsets */
const setTotal = id => (setMeta(id)?.total || 0) + (CHILDREN[id] || []).reduce((a, c) => a + (setMeta(c)?.total || 0), 0);

/* per-set price/variant cache: {cardId: {v:[variants], p:{variant: EUR}, r:rarity, t}} */
const priceMem = {};
function prices(setId){ return priceMem[setId] || (priceMem[setId] = lsGet("setdex-p-" + setId, {})); }
function savePrices(setId){
  if(!lsSet("setdex-p-" + setId, prices(setId))){ trimCaches(setId); lsSet("setdex-p-" + setId, prices(setId)); }
}
function trimCaches(keep){
  // free space by dropping cached set data for sets you own nothing in
  const ownedSets = new Set(Object.values(col.cards).map(e => e.s));
  try{
    Object.keys(localStorage).forEach(k => {
      const m = k.match(/^setdex-(p|set)-(.+)$/);
      if(m && m[2] !== keep && !ownedSets.has(m[2])) localStorage.removeItem(k);
    });
  }catch(e){}
}
const num = x => (typeof x === "number" && isFinite(x) && x > 0) ? x : null;
function slim(c){
  const vr = c.variants || {};
  const v = [];
  if(vr.normal) v.push("normal");
  if(vr.holo) v.push("holo");
  if(vr.reverse) v.push("reverse");
  if(vr.firstEdition) v.push("firstEdition");
  if(!v.length) v.push("normal");
  const cm = c.pricing?.cardmarket || {};
  const tp = c.pricing?.tcgplayer || {};
  const usd = usdToEur();
  const tpv = k => {
    const keys = {normal:["normal"], holo:["holo","holofoil"], reverse:["reverse","reverse-holofoil","reverseHolofoil"], firstEdition:["1st-edition","firstEdition","1stEditionHolofoil","1st-edition-holofoil"]}[k];
    for(const kk of keys){ const m = num(tp[kk]?.marketPrice) ?? num(tp[kk]?.midPrice); if(m) return +(m * usd).toFixed(2); }
    return null;
  };
  const base = num(cm.trend) ?? num(cm.avg) ?? num(cm.avg30);
  const foil = num(cm["trend-holo"]) ?? num(cm["avg-holo"]) ?? num(cm["avg30-holo"]);
  const p = {};
  for(const k of v){
    let eur;
    if(k === "reverse") eur = foil;
    else if(k === "holo" && v.includes("normal")) eur = foil ?? base;
    else eur = base;
    p[k] = eur ?? tpv(k);
  }
  return {v, p, r:c.rarity || "", t:Date.now()};
}
const info = (setId, id) => prices(setId)[id];
const variantsOf = (setId, id) => info(setId, id)?.v || ["normal"];
const priceOf = (setId, id, v) => { const p = info(setId, id)?.p; return p ? (p[v] ?? null) : null; };

/* move counts saved under a variant the card doesn't have (added before details loaded) */
function reconcile(setId, id){
  const e = col.cards[id], i = info(setId, id);
  if(!e || !i) return false;
  let changed = false;
  for(const k of Object.keys(e.q)){
    if(!i.v.includes(k)){ e.q[i.v[0]] = (e.q[i.v[0]] || 0) + e.q[k]; delete e.q[k]; changed = true; }
  }
  if(changed){ touch(id); saveCol(); }
  return changed;
}

let loadToken = 0;
/* fetch full card details (variants + prices) for the given cards, 6 at a time */
async function loadDetails(setId, cards, onTick, force){
  const token = loadToken;
  const ps = prices(setId);
  const todo = cards.filter(c => force || !ps[c.id] || Date.now() - ps[c.id].t > DAY);
  if(!todo.length){ onTick && onTick(0, 0); return; }
  let i = 0, done = 0, since = 0, failed = 0;
  async function worker(){
    while(i < todo.length && token === loadToken){
      const c = todo[i++];
      try{ ps[c.id] = slim(await getJSON("/cards/" + encodeURIComponent(c.id))); reconcile(setId, c.id); }
      catch(e){ failed++; }
      done++;
      if(++since >= 25){ since = 0; savePrices(setId); }
      if(token === loadToken && onTick) onTick(done, todo.length, failed);
    }
  }
  await Promise.all(Array.from({length:6}, worker));
  savePrices(setId);
}

/* ---------- exchange rates (ECB daily rates via frankfurter.dev, free, no key) ---------- */
const CURRENCIES = {EUR:["Euro (€)", "en-IE"], NOK:["Norwegian kroner (kr)", "nb-NO"], SEK:["Swedish kronor (kr)", "sv-SE"], DKK:["Danish kroner (kr)", "da-DK"], USD:["US dollars ($)", "en-US"], GBP:["British pounds (£)", "en-GB"]};
let fx = lsGet("setdex-rates", null); // {t, date, rates:{NOK:…, USD:…}} per 1 EUR
async function refreshRates(force){
  if(!force && fx && Date.now() - fx.t < DAY / 2) return false;
  for(const u of ["https://api.frankfurter.dev/v1/latest?base=EUR", "https://api.frankfurter.app/latest?from=EUR"]){
    try{
      const r = await fetch(u); if(!r.ok) continue;
      const d = await r.json();
      if(d && d.rates && d.rates.USD){ fx = {t:Date.now(), date:d.date, rates:d.rates}; lsSet("setdex-rates", fx); return true; }
    }catch(e){}
  }
  return false;
}
/* how many of the chosen currency one euro buys */
function eurRate(cur){
  if(cur === "EUR") return 1;
  const s = col.settings;
  if(s.auto && fx?.rates?.[cur]) return fx.rates[cur];
  return s.manual[cur] || fx?.rates?.[cur] || null;
}
function usdToEur(){
  const s = col.settings;
  if(s.auto && fx?.rates?.USD) return 1 / fx.rates.USD;
  return s.usd || 0.9;
}
function money(eur){
  if(eur == null) return "–";
  let cur = col.settings.currency;
  let rate = eurRate(cur);
  if(!rate){ cur = "EUR"; rate = 1; }
  const v = eur * rate;
  const big = cur !== "EUR" && cur !== "USD" && cur !== "GBP" && v >= 100;
  return new Intl.NumberFormat((CURRENCIES[cur] || CURRENCIES.EUR)[1], {style:"currency", currency:cur, maximumFractionDigits: big ? 0 : 2}).format(v);
}
const pct = (a, b) => b ? Math.floor(a / b * 1000) / 10 : 0;
const img = (base, q) => base ? `${base}/${q || "low"}.webp` : "";
const logo = u => u ? u + ".webp" : "";
const sinfo = id => { const x = SETINFO[id]; return {code:x?.[0] || "", date:x?.[1] || "", serieId:x?.[2] || "", serie:x?.[3] || "New sets"}; };
/* TCG Pocket (the phone game) sets: hide them, including future ones (ids like A1, A4a, B2, P-A) */
const isPocket = id => sinfo(id).serieId === "tcgp" || (!SETINFO[id] && /^([A-Z]\d+[a-z]?|P-[A-Z])$/.test(id));
/* <img> that tries each URL in turn, then shows a text placeholder */
function imgTag(urls, alt, ph, lazy){
  urls = urls.filter(Boolean);
  if(!urls.length) return ph;
  return `<img ${lazy ? 'loading="lazy"' : ""} src="${esc(urls[0])}" alt="${esc(alt)}" data-fb="${esc(JSON.stringify(urls.slice(1)))}" data-ph="${esc(ph)}" onerror="imgFail(this)">`;
}
/* sets with no logo anywhere: use the first card picture of the set as its cover */
let coverQueue = Promise.resolve();
function fillCover(el){
  const id = el.dataset.cover; if(!id || el.dataset.done) return; el.dataset.done = 1;
  coverQueue = coverQueue.then(async () => {
    try{
      const set = await getSet(id);
      const urls = set.cards.filter(c => c.image).slice(0, 3).map(c => img(c.image));
      if(!urls.length || !document.body.contains(el)) return;
      const im = new Image(); im.className = "cover"; im.alt = "";
      let k = 0;
      im.onload = () => el.replaceWith(im);
      im.onerror = () => { if(++k < urls.length) im.src = urls[k]; };
      im.src = urls[0];
    }catch(e){}
  });
}
function imgFail(el){
  let rest = [];
  try{ rest = JSON.parse(el.dataset.fb || "[]"); }catch(e){}
  if(rest.length){ el.dataset.fb = JSON.stringify(rest.slice(1)); el.src = rest[0]; return; }
  const t = document.createElement("template"); t.innerHTML = el.dataset.ph || "";
  const cov = t.content.querySelector("[data-cover]");

}
/* TCGdex is missing English pictures for some sets; try the other languages' pictures */
function cardUrls(c, setId, q){
  const real = c.rs || setId, sid = sinfo(real).serieId;
  const alt = sid ? LANGS.map(l => `https://assets.tcgdex.net/${l}/${sid}/${real}/${encodeURIComponent(c.localId)}/${q || "low"}.webp`) : [];
  const pid = PTCG[real], num = /^\d+$/.test(c.localId) ? String(+c.localId) : c.localId;

  // TCGdex English first, then the Pokémon TCG API, then TCGdex in other languages
  return c.image ? [img(c.image, q), ...ptcg, ...alt.slice(1)] : [...(c.guess ? alt.slice(0, 1) : []), ...ptcg, ...alt.slice(1)];
}
/* set logos and symbols from the Pokémon TCG API (official images, made for apps) */
const PTCG_SCRYDEX = new Set(["me2pt5","me3","me4","me5","me55","me55c"]);
const ptcgArt = (setId, kind) => { const pid = PTCG[setId]; if(!pid) return "";
  return PTCG_SCRYDEX.has(pid) ? `https://images.scrydex.com/pokemon/${pid}-${kind}/${kind}` : `https://images.pokemontcg.io/${pid}/${kind}.png`; };

  return [...(s.logo ? [logo(s.logo)] : []), ptcgArt(s.id, "logo"), ...alt.slice(1), ...cover].filter(Boolean);

const isOfficial = (localId, off) => /^\d+$/.test(localId) && +localId <= off;
let toastT;
function toast(msg, undo){
  const t = document.getElementById("toast"); t.textContent = msg;
  if(undo){ const b = document.createElement("button"); b.className = "undo"; b.textContent = "Undo"; b.onclick = () => { t.classList.remove("on", "act"); undo(); }; t.append(b); }

/* remove cards from the collection, with undo */
function removeCards(ids, label){
  const before = JSON.parse(JSON.stringify(col.cards));
  let n = 0;
  const now = Date.now();
  ids.forEach(id => { if(col.cards[id]){ n += ownedCount(id); delete col.cards[id]; col.del[id] = now; } });
  if(!n){ toast("Nothing to remove"); return 0; }
  saveCol();
  toast(`Removed ${n} card${n > 1 ? "s" : ""} from ${label}`, () => {
    const t = Date.now();
    Object.entries(before).forEach(([id, e]) => { if(!col.cards[id]){ col.cards[id] = Object.assign(e, {u:t}); delete col.del[id]; } });

  });

}
const loading = msg => `<div class="center"><div class="spin"></div>${esc(msg || "Loading…")}</div>`;

/* ---------- stats ---------- */
function setStats(set, cards){
  cards = cards || set.cards;
  const ps = prices(set.id);
  const off = set.official || set.cards.length;
  let uniq = 0, offTotal = 0, offOwned = 0, master = 0, masterOwned = 0, setVal = 0, masterVal = 0, myVal = 0, priced = 0, known = 0;
  for(const c of cards){
    const i = ps[c.id]; const vs = i?.v || ["normal"]; const e = col.cards[c.id];
    const has = e && Object.keys(e.q).length;
    if(i) known++;
    if(!c.part && isOfficial(c.localId, off)){ offTotal++; if(has) offOwned++; }
    if(has) uniq++;
    master += vs.length;
    vs.forEach(v => { const p = i?.p?.[v]; if(p != null) masterVal += p; if(e?.q?.[v]) masterOwned++; });
    const bp = i?.p?.[vs[0]];
    if(bp != null){ setVal += bp; priced++; }
    if(e) for(const [v, n] of Object.entries(e.q)){ const p = i?.p?.[v]; if(p != null) myVal += p * n; }
  }
  return {uniq, total:cards.length, offOwned, offTotal, master, masterOwned, setVal, masterVal, myVal, priced, known};
}

        <button class="chip" data-cf="all">All</button>
        <button class="chip" data-cf="have">Have</button>
        <button class="chip" data-cf="need">Need</button>
      </div>
      <div class="chips">
        <button class="chip" data-cs="num">By number</button>
        <button class="chip" data-cs="price">By price</button>
      </div>
      <span class="loadnote" id="ln"></span>
      <button class="btn small" id="wantmiss">♡ Want missing</button>
      <button class="btn small danger" id="reset">Reset</button>
    </div>
    <div class="grid" id="grid"></div>`;
  document.getElementById("wantmiss").onclick = () => {
    const miss = partCards().filter(c => !ownedCount(c.id) && !isWanted(c.id));
    if(!miss.length){ toast("No missing cards to add"); return; }
    if(!confirm(`Add ${miss.length} missing cards to your wants list?`)) return;
    const t = Date.now();
    miss.forEach(c => { col.wants[c.id] = {s:set.id, n:c.name, l:c.localId, i:c.image || "", u:t, ...(c.rs ? {r:c.rs} : {})}; delete col.del["w:" + c.id]; });
    saveCol(); drawGrid();
    toast(`Added ${miss.length} cards to your wants`, () => { const t2 = Date.now(); miss.forEach(c => { delete col.wants[c.id]; col.del["w:" + c.id] = t2; }); saveCol(); drawGrid(); });
  };
  document.getElementById("reset").onclick = () => {
    const mine = partCards().filter(c => ownedCount(c.id));
    const label = part === "all" || part === "main" || !set.subs?.length ? set.name : (set.subs.find(x => x.id === part)?.name || set.name);
    if(!mine.length){ toast(`You have no cards in ${label}`); return; }
    if(!confirm(`Remove all ${mine.length} cards you own in ${label}?\n\nYou can press Undo right after.`)) return;
    removeCards(mine.map(c => c.id), label);
    drawGrid(); drawStats();
  };
  const grid = document.getElementById("grid");
  const syncChips = () => {
    main.querySelectorAll("[data-cf]").forEach(b => b.classList.toggle("on", b.dataset.cf === cardFilter));
    main.querySelectorAll("[data-cs]").forEach(b => b.classList.toggle("on", b.dataset.cs === cardSort));
  };
  main.querySelectorAll("[data-cf]").forEach(b => b.onclick = () => { cardFilter = b.dataset.cf; syncChips(); drawGrid(); });
  main.querySelectorAll("[data-cs]").forEach(b => b.onclick = () => { cardSort = b.dataset.cs; syncChips(); drawGrid(); });
  syncChips();

  function drawGrid(){
    let cards = partCards().slice();
    if(cardFilter === "have") cards = cards.filter(c => ownedCount(c.id));
    if(cardFilter === "need") cards = cards.filter(c => !ownedCount(c.id));
    if(cardSort === "price") cards.sort((a, b) => (priceOf(set.id, b.id, variantsOf(set.id, b.id)[0]) ?? -1) - (priceOf(set.id, a.id, variantsOf(set.id, a.id)[0]) ?? -1));
    const sectioned = cardSort === "num" && set.subs?.length && part === "all";
    let last = null;
    grid.innerHTML = cards.length ? cards.map(c => {
      let h = "";
      if(sectioned && (c.sub || "") !== last){ last = c.sub || ""; h = `<div class="sec">${esc(c.sub || set.name)}</div>`; }
      return h + tileHTML(c, set.id);
    }).join("") : `<p class="muted">${cardFilter === "have" ? "No cards from this set yet." : "You have every card in this set. Nice!"}</p>`;
  }
  drawGrid();
  drawStats();
  bindGrid(grid, () => set.id, cid => set.cards.find(c => c.id === cid), () => drawStats());

  // load variants + prices in the background
  const ln = document.getElementById("ln");
  let raf = 0;
  await loadDetails(set.id, set.cards, (d, n, failed) => {
    if(!document.body.contains(ln)) return;
    ln.textContent = n && d < n ? `Loading prices ${d}/${n}…` : (failed ? `${failed} cards couldn't load. Reopen the set to retry.` : "");
    if(!raf) raf = requestAnimationFrame(() => { raf = 0; drawStats(); refreshTiles(grid, set.id); });
  });
  if(document.body.contains(grid)){ drawStats(); refreshTiles(grid, set.id); if(cardSort === "price") drawGrid(); }
}

/* numbers 1..official that the card database doesn't have */
function missingNote(set){
  const off = set.official; if(!off) return "";
  const have = new Set(set.cards.filter(c => !c.rs).map(c => c.localId.replace(/^0+(?=\d)/, "")));
  if(![...have].some(x => /^\d+$/.test(x))) return "";
  const miss = []; for(let k = 1; k <= off; k++) if(!have.has(String(k)) && !have.has(k + "a")) miss.push(k);
  if(!miss.length) return "";
  const ranges = []; miss.forEach(k => { const r = ranges[ranges.length - 1]; if(r && r[1] === k - 1) r[1] = k; else ranges.push([k, k]); });
  return `<div class="note">The card database is missing ${miss.length} card${miss.length > 1 ? "s" : ""} from this set: #${ranges.map(r => r[0] === r[1] ? r[0] : r[0] + "–" + r[1]).join(", #")}. They'll appear here when the database adds them.</div>`;
}
/* cards shown on the open set page: main set, one subset, or both */
function partCards(){
  const {set, part} = current;
  if(part === "main") return set.cards.filter(c => !c.part);
  if(part && part !== "all") return set.cards.filter(c => c.part === part);
  return set.cards;
}
function drawStats(){
  const el = document.getElementById("stats");
  if(!el || !current) return;
  const set = current.set, s = setStats(set, partCards());
  const p = pct(s.uniq, s.total);
  const partial = s.priced < s.total ? `<div class="sub faint">${s.known < s.total ? "loading…" : `${s.total - s.priced} cards have no price`}</div>` : "";
  el.innerHTML = `
    <div class="stat panel hero"><div class="lb">${current.part === "all" || current.part === "main" || !set.subs?.length ? "Set progress" : esc(set.subs.find(x => x.id === current.part)?.name || "") + " progress"}</div>
      <div class="vl">${s.uniq} <span class="faint">/ ${s.total}</span> <span style="font-size:17px" class="muted">${p}%</span></div>
      <div class="bar ${s.uniq && s.uniq >= s.total ? "done" : ""}"><i style="width:${p}%"></i></div>
      <div class="sub">${s.offTotal ? `Main set ${s.offOwned}/${s.offTotal} · ` : ""}Master set ${s.masterOwned}/${s.master} (all variants)</div></div>
    <div class="stat panel"><div class="lb">Set value</div><div class="vl">${money(s.setVal)}</div><div class="sub">One of every card</div>${partial}</div>
    <div class="stat panel"><div class="lb">Master set value</div><div class="vl">${money(s.masterVal)}</div><div class="sub">Every variant</div></div>
    <div class="stat panel"><div class="lb">My cards</div><div class="vl" style="color:var(--good)">${money(s.myVal)}</div><div class="sub">${pct(s.myVal, s.masterVal)}% of master value</div></div>`;
}

const qcHTML = (n, name) => (n ? `<button data-act="minus" aria-label="Remove one ${esc(name || "")}">−</button><span class="cnt">${n}</span>` : "") + `<button data-act="add" aria-label="Add one ${esc(name || "")}">+</button>`;
const flagsHTML = id => (tradeCount(id) ? `<span class="fl t">${tradeCount(id)} for trade</span>` : "") + (isWanted(id) ? `<span class="fl w">♥ Want</span>` : "");
function tileHTML(c, setId, showSet, opt){
  opt = opt || {};
  const n = ownedCount(c.id);
  const vs = variantsOf(setId, c.id);
  const bp = priceOf(setId, c.id, vs[0]);
  return `<div class="tile ${n || opt.noqc ? "own" : ""}" data-id="${esc(c.id)}" data-set="${esc(setId)}">
    <button class="art" data-act="open" aria-label="${esc(c.name)}">${imgTag(cardUrls(c, setId), c.name, `<div class="noimg"><b>#${esc(c.localId)}</b>${esc(c.name)}<span>No picture yet</span></div>`, true)}<span class="flags">${opt.noqc ? "" : flagsHTML(c.id)}</span></button>
    ${opt.noqc ? "" : `<div class="qc">${qcHTML(n, c.name)}</div>`}
    <div class="meta"><span class="num">#${esc(c.localId)} ${esc(c.name)}</span><span class="price">${bp != null ? money(bp) : ""}</span></div>
    ${showSet || c.sub ? `<div class="sname">${showSet && sinfo(setId).code ? `<span class="code">${esc(sinfo(setId).code)}</span> ` : ""}${esc(c.sub || setMeta(setId)?.name || setId)}</div>` : ""}
    ${opt.note ? `<div class="sname tnote">${opt.note}</div>` : ""}
    <div class="vd">${vs.length > 1 ? vs.map(v => `<i class="${qty(c.id, v) ? "on" : ""}" title="${VLABEL[v]}"></i>`).join("") : ""}</div>
  </div>`;
}
function refreshTile(el){
  const id = el.dataset.id, setId = el.dataset.set;
  const n = ownedCount(id), vs = variantsOf(setId, id), bp = priceOf(setId, id, vs[0]);
  el.classList.toggle("own", !!n || !el.querySelector(".qc"));
  const qc = el.querySelector(".qc"); if(qc){ qc.innerHTML = qcHTML(n); el.querySelector(".flags").innerHTML = flagsHTML(id); }
  el.querySelector(".price").textContent = bp != null ? money(bp) : "";
  el.querySelector(".vd").innerHTML = vs.length > 1 ? vs.map(v => `<i class="${qty(id, v) ? "on" : ""}" title="${VLABEL[v]}"></i>`).join("") : "";
}
function refreshTiles(grid){ grid.querySelectorAll(".tile").forEach(refreshTile); }

/* clicks on tiles: + adds the first variant, image opens the detail */
function bindGrid(grid, setIdOf, cardOf, onChange){
  grid.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if(!b) return;
    const tile = b.closest(".tile"); const id = tile.dataset.id; const setId = tile.dataset.set || setIdOf();
    const card = cardOf(id, tile); if(!card) return;
    const vs = variantsOf(setId, id);
    if(b.dataset.act === "add"){
      // + adds one of the normal version (open the card for reverse holos etc.)
      setQty(card, setId, vs[0], qty(id, vs[0]) + 1);
      refreshTile(tile); onChange && onChange();
      toast(`Added ${card.name} (${ownedCount(id)} owned)`);
    }else if(b.dataset.act === "minus"){
      // − removes one: from the normal version first, then the other versions
      const v = qty(id, vs[0]) ? vs[0] : Object.keys(col.cards[id]?.q || {})[0];
      if(!v) return;
      setQty(card, setId, v, qty(id, v) - 1);
      refreshTile(tile); onChange && onChange();
      const left = ownedCount(id);
      toast(left ? `Removed one ${card.name} (${left} left)` : `Removed ${card.name}`);
    }else openCard(card, setId, () => { refreshTile(tile); onChange && onChange(); });
  });
}

async function openCard(card, setId, onChange){
  const render = () => {
    const i = info(setId, card.id); const vs = variantsOf(setId, card.id);
    let mine = 0;
    vs.forEach(v => { const p = priceOf(setId, card.id, v); if(p != null) mine += p * qty(card.id, v); });
    dlg.innerHTML = `<div style="position:relative"><button class="x" data-x aria-label="Close">×</button>
      <div class="md">
        <div class="big">${imgTag(cardUrls(card, setId, "high"), card.name, `<div class="noimg" style="height:100%;display:flex;align-items:center;justify-content:center">No picture yet</div>`, false)}</div>
        <div>
          <h3>${esc(card.name)}</h3>
          <div class="muted">${esc(setMeta(setId)?.name || setId)}${card.sub ? " · " + esc(card.sub) : ""} · #${esc(card.localId)}${i?.r ? " · " + esc(i.r) : ""}</div>
          <div style="margin-top:14px">
            ${vs.map(v => `<div class="vrow"><div><div class="vn">${VLABEL[v] || v}</div><div class="vp">${i ? (priceOf(setId, card.id, v) != null ? money(priceOf(setId, card.id, v)) : "No price") : "Loading price…"}</div></div>
              <div class="step"><button data-v="${v}" data-d="-1" aria-label="Remove one">−</button><span>${qty(card.id, v)}</span><button data-v="${v}" data-d="1" aria-label="Add one">+</button></div></div>
              ${qty(card.id, v) ? `<div class="trow"><span>For trade <span class="faint">(of your ${qty(card.id, v)})</span></span><div class="step sm"><button data-v="${v}" data-t="-1" aria-label="One less for trade">−</button><span>${col.cards[card.id]?.t?.[v] || 0}</span><button data-v="${v}" data-t="1" aria-label="One more for trade">+</button></div></div>` : ""}`).join("")}
          </div>
          <div style="margin-top:12px"><button class="btn small ${isWanted(card.id) ? "wanted" : ""}" data-want>${isWanted(card.id) ? "♥ On your wants list" : "♡ Add to wants"}</button></div>
          <p class="muted" style="margin-top:14px">Your copies are worth <b style="color:var(--good)">${money(mine)}</b></p>
          <p style="font-size:13px"><a href="https://www.cardmarket.com/en/Pokemon/Products/Search?searchString=${encodeURIComponent(card.name)}" target="_blank" rel="noopener">Look up on Cardmarket ↗</a></p>
        </div>
      </div></div>`;
  };
  render();
  dlg.onclick = e => {
    if(e.target === dlg || e.target.closest("[data-x]")){ dlg.close(); return; }
    if(e.target.closest("[data-want]")){ setWant(card, setId, !isWanted(card.id)); render(); onChange && onChange(); return; }
    const t = e.target.closest("[data-t]");
    if(t){ setTrade(card.id, t.dataset.v, (col.cards[card.id]?.t?.[t.dataset.v] || 0) + (+t.dataset.t)); render(); onChange && onChange(); return; }
    const b = e.target.closest("[data-d]"); if(!b) return;
    setQty(card, setId, b.dataset.v, qty(card.id, b.dataset.v) + (+b.dataset.d));
    render(); onChange && onChange();
  };
  if(!dlg.open) dlg.showModal();
  if(!info(setId, card.id)){
    try{ prices(setId)[card.id] = slim(await getJSON("/cards/" + encodeURIComponent(card.id))); reconcile(setId, card.id); savePrices(setId); }catch(e){}
    if(dlg.open){ render(); onChange && onChange(); }
  }
}

async function viewCollection(){
  main.innerHTML = loading("Adding up your collection…");
  try{ await getSets(); }catch(e){}
  const bySet = {};
  Object.entries(col.cards).forEach(([id, e]) => (bySet[e.s] = bySet[e.s] || []).push([id, e]));
  let total = 0, copies = 0, unpriced = 0;
  const top = [];
  const rows = Object.entries(bySet).map(([sid, list]) => {
    let val = 0;
    list.forEach(([id, e]) => Object.entries(e.q).forEach(([v, n]) => {
      copies += n; const p = priceOf(sid, id, v);
      if(p == null) unpriced += n; else { val += p * n; const t = top.find(x => x.id === id); if(t) t.p += p * n; else top.push({id, e, sid, p:p * n}); }
    }));
    total += val;
    const m = Object.assign({name:sid, logo:""}, setMeta(sid) || {}, {total:setTotal(sid)});
    return {sid, m, have:list.length, val};
  }).sort((a, b) => pct(b.have, b.m.total) - pct(a.have, a.m.total));
  top.sort((a, b) => b.p - a.p);
  const uniq = Object.keys(col.cards).length;
  main.innerHTML = `
    <h1>My collection</h1>
    <div class="stats">
      <div class="stat panel hero"><div class="lb">Collection value</div><div class="vl" style="color:var(--good)">${money(total)}</div><div class="sub">${unpriced ? `${unpriced} copies have no price yet. Press Update prices.` : "Cardmarket trend prices"}</div></div>
      <div class="stat panel"><div class="lb">Unique cards</div><div class="vl">${uniq}</div></div>
      <div class="stat panel"><div class="lb">Total copies</div><div class="vl">${copies}</div></div>
      <div class="stat panel"><div class="lb">Sets started</div><div class="vl">${rows.length}</div></div>
    </div>
    <div class="toolbar"><button class="btn" id="upd">Update prices</button><span class="loadnote" id="ln"></span></div>
    ${rows.length ? `<h2>Sets</h2><div class="rows">${rows.map(r => {
      const p = pct(r.have, r.m.total);
      return `<a class="srow panel" href="#/set/${encodeURIComponent(r.sid)}">
        <div>${imgTag(logoUrls({id:r.sid, logo:r.m.logo}), r.m.name, "", true)}</div>
        <div><b>${esc(r.m.name)}</b> <span class="faint">${r.have} / ${r.m.total || "?"} · ${p}%</span><div class="bar ${r.m.total && r.have >= r.m.total ? "done" : ""}"><i style="width:${p}%"></i></div></div>
        <div class="r">${money(r.val)}</div></a>`;
    }).join("")}</div>
    ${top.length ? `<h2>Most valuable cards</h2><div class="grid" id="top">${top.slice(0, 12).map(t => tileHTML({id:t.id, name:t.e.n, localId:t.e.l, image:t.e.i, rs:t.e.r}, t.sid, true)).join("")}</div>` : ""}`
    : `<div class="panel" style="padding:22px;margin-top:10px"><b>Nothing here yet.</b><p class="muted">Go to <a href="#/sets">Sets</a>, open a set, and tap <b>+</b> on every card you own. Tap a card's picture to add reverse holos and other variants.</p></div>`}`;
  const tg = document.getElementById("top");
  if(tg) bindGrid(tg, null, (id) => { const e = col.cards[id]; return e && {id, name:e.n, localId:e.l, image:e.i, rs:e.r}; }, null);
  document.getElementById("upd").onclick = async (ev) => {
    ev.target.disabled = true;
    const ln = document.getElementById("ln");
    const jobs = Object.entries(bySet);
    let k = 0;
    for(const [sid, list] of jobs){
      k++;
      if(!document.body.contains(ln)) return;
      ln.textContent = `Updating ${setMeta(sid)?.name || sid} (${k}/${jobs.length})…`;
      await loadDetails(sid, list.map(([id]) => ({id})), null, true);
    }
    if(document.body.contains(ln)){ toast("Prices updated"); viewCollection(); }
  };
}

async function viewSearch(){
  try{ await getSets(); }catch(e){}
  const last = sessionGet("setdex-q") || "";
  main.innerHTML = `<h1>Search cards</h1>
    <div class="toolbar"><input class="input" id="q" placeholder="Card name, e.g. Charizard" value="${esc(last)}" autocomplete="off"></div>
    <div class="grid" id="res"></div>`;
  const q = document.getElementById("q"), res = document.getElementById("res");
  let t, n = 0, found = [];
  const run = async () => {
    const term = q.value.trim(); sessionSet("setdex-q", term);
    if(term.length < 2){ res.innerHTML = `<p class="muted">Type at least 2 letters.</p>`; return; }
    const my = ++n; res.innerHTML = loading("Searching…");
    try{
      const d = await getJSON("/cards?name=" + encodeURIComponent(term));
      if(my !== n) return;
      found = d.slice(-120).reverse().map(c => ({id:c.id, localId:String(c.localId), name:c.name, image:c.image || "", rs:c.id.slice(0, c.id.length - String(c.localId).length - 1)})).filter(c => !isPocket(c.rs)).map(c => Object.assign(c, {s:parentOf(c.rs)}));
      res.innerHTML = found.length ? found.map(c => tileHTML(c, c.s, true)).join("") : `<p class="muted">No cards found.</p>`;
    }catch(e){ if(my === n) res.innerHTML = `<p class="muted">Search failed. Check your internet connection.</p>`; }
  };
  q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(run, 350); });
  bindGrid(res, null, id => found.find(c => c.id === id), null);
  if(last) run(); else res.innerHTML = `<p class="muted">Find a card across every set and add it to your collection.</p>`;
  q.focus();
}

/* ---------- sync with a private GitHub repository ---------- */
/* The token is kept only in this browser (setdex-sync), never in backups or in the synced file. */
let sync = lsGet("setdex-sync", null);   // {repo:"owner/name", token, sha, last}
const SYNC_FILE = "collection.json";
let syncState = "", syncMsg = "", syncTimer = 0, syncing = null;
function setSync(state, msg){
  syncState = state; syncMsg = msg || "";
  const el = document.getElementById("syncst"); if(!el) return;
  el.hidden = !sync;
  el.className = "syncst " + state;
  el.innerHTML = `<span>${esc({ok:"Synced", busy:"Syncing…", err:"Sync problem"}[state] || "")}</span>`;
  el.title = msg || "";
  const info = document.getElementById("syncinfo"); if(info) drawSyncInfo();
}
function b64enc(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
async function ghFetch(path, opts){
  const r = await fetch("https://api.github.com" + path, Object.assign({cache:"no-store"}, opts, {headers:{
    Authorization:"Bearer " + sync.token, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
    ...(opts && opts.body ? {"Content-Type":"application/json"} : {})}}));
  return r;
}
async function ghError(r){
  let gm = ""; try{ gm = (await r.clone().json()).message || ""; }catch(e){}
  const base = ghErrorText(r);
  return gm ? `${base} (GitHub says: "${gm}")` : base;
}
function ghErrorText(r){
  if(r.status === 401) return "GitHub didn't accept the token. It may be wrong or expired. Make a new one and connect again.";
  if(r.status === 403) return "The token isn't allowed to change this repository. Give it Contents: Read and write.";
  if(r.status === 404) return "Couldn't find the repository. Check the name, and that the token has access to it.";
  return "GitHub answered with error " + r.status + ".";
}
async function readRemote(){
  const r = await ghFetch(`/repos/${sync.repo}/contents/${SYNC_FILE}`);
  // 404 = no collection file yet; 409 = the repository is completely empty
  if(r.status === 404 || r.status === 409) return {data:{cards:{}, del:{}}, sha:null};
  if(!r.ok) throw new Error(await ghError(r));
  const j = await r.json();
  let text = j.content ? b64dec(j.content) : "";
  if(!text && j.sha){   // files over 1 MB come without content
    const b = await ghFetch(`/repos/${sync.repo}/git/blobs/${j.sha}`);
    if(!b.ok) throw new Error(await ghError(b));
    text = b64dec((await b.json()).content);
  }
  return {data:JSON.parse(text || "{}"), sha:j.sha};
}
/* newest change wins, card by card */
function mergeMap(L, R, LD, RD, pre, del, old){
  const out = {};
  const ids = new Set([...Object.keys(L), ...Object.keys(R)]);
  [...Object.keys(LD), ...Object.keys(RD)].forEach(k => { if(pre ? k.startsWith(pre) : !k.startsWith("w:")) ids.add(k.slice(pre.length)); });
  ids.forEach(id => {
    const a = L[id], b = R[id];
    const best = a && b ? ((b.u || 0) > (a.u || 0) ? b : a) : (a || b);
    const dt = Math.max(LD[pre + id] || 0, RD[pre + id] || 0);
    if(best && (best.u || 0) >= dt) out[id] = best;
    else if(dt > old) del[pre + id] = dt;
  });
  return out;
}
function mergeInto(remote){
  const rd = remote.del || {}, del = {}, old = Date.now() - 180 * DAY;
  col.cards = mergeMap(col.cards, remote.cards || {}, col.del, rd, "", del, old);
  col.wants = mergeMap(col.wants, remote.wants || {}, col.del, rd, "w:", del, old);
  col.del = del;
  if((remote.fu || 0) > (col.fu || 0)){ col.friends = remote.friends || {}; col.fu = remote.fu; }
  if((remote.su || 0) > (col.su || 0) && remote.settings){ col.settings = Object.assign({}, col.settings, remote.settings); col.su = remote.su; }
}
const payload = () => JSON.stringify({app:"setdex", version:2, updated:new Date().toISOString(), cards:col.cards, wants:col.wants, del:col.del, settings:col.settings, su:col.su || 0, friends:col.friends, fu:col.fu || 0});
const sameData = (a, b) => JSON.stringify([a.cards || {}, a.wants || {}, a.del || {}, a.su || 0, a.fu || 0]) === JSON.stringify([b.cards || {}, b.wants || {}, b.del || {}, b.su || 0, b.fu || 0]);
async function syncNow(){
  if(!sync?.token) return false;
  if(syncing) return syncing;
  syncing = (async () => {
    setSync("busy");
    const before = JSON.stringify([col.cards, col.wants, col.friends, col.settings]);
    for(let attempt = 0; attempt < 3; attempt++){
      try{
        const {data, sha} = await readRemote();
        mergeInto(data);
        lsSet("setdex-collection", col);
        if(!sha || !sameData(data, col)){
          const n = Object.keys(col.cards).length;
          const r = await ghFetch(`/repos/${sync.repo}/contents/${SYNC_FILE}`, {method:"PUT", body:JSON.stringify({
            message:`Update collection (${n} card${n === 1 ? "" : "s"})`, content:b64enc(payload()), ...(sha ? {sha} : {})})});
          if(r.status === 409 || r.status === 422){ continue; }   // changed on another device meanwhile: read again
          if(!r.ok) throw new Error(await ghError(r));
          sync.sha = (await r.json()).content?.sha;
        }else sync.sha = sha;
        sync.last = Date.now(); lsSet("setdex-sync", sync);
        setSync("ok", "Last synced " + new Date(sync.last).toLocaleString());
        if(JSON.stringify([col.cards, col.wants, col.friends, col.settings]) !== before && !dlg.open && !/settings/.test(location.hash)) route();
        return true;
      }catch(e){
        setSync("err", e.message === "Failed to fetch" ? "Couldn't reach GitHub. You may be offline; changes are saved on this device and will sync later." : e.message);
        return false;
      }
    }
    setSync("err", "Couldn't save to GitHub after several tries. Try Sync now.");
    return false;
  })();
  try{ return await syncing; } finally{ syncing = null; }
}
function syncSoon(){
  if(!sync?.token) return;
  setSync("busy");
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 2500);
}
let lastFocusSync = 0;
function syncOnFocus(){
  if(!sync?.token || document.visibilityState !== "visible" || Date.now() - lastFocusSync < 30000) return;
  lastFocusSync = Date.now(); syncNow();
}
document.addEventListener("visibilitychange", syncOnFocus);
window.addEventListener("online", () => sync && syncNow());

function drawSyncInfo(){
  const box = document.getElementById("syncinfo"); if(!box) return;
  if(sync){
    box.innerHTML = `<p style="margin:0">Connected to <b>${esc(sync.repo)}</b>.<br><span class="${syncState === "err" ? "" : "muted"}" style="${syncState === "err" ? "color:var(--accent)" : ""}">${esc(syncMsg || (sync.last ? "Last synced " + new Date(sync.last).toLocaleString() : ""))}</span></p>
      <div class="chips"><button class="btn primary" id="syncnow">Sync now</button><button class="btn" id="qrbtn">Connect another device (QR code)</button><button class="btn" id="syncoff">Disconnect this device</button></div>
      <div id="qrout"></div>`;
    document.getElementById("syncnow").onclick = () => syncNow();
    document.getElementById("qrbtn").onclick = () => showConnectQR(document.getElementById("qrout"));
    document.getElementById("syncoff").onclick = () => {
      if(!confirm("Disconnect this device from GitHub? Your cards stay on this device and in your GitHub repository.")) return;
      sync = null; try{ localStorage.removeItem("setdex-sync"); }catch(e){}
      setSync(""); drawSyncInfo(); toast("Disconnected");
    };
  }else{
    const owner = /\.github\.io$/.test(location.hostname) ? location.hostname.split(".")[0] : "";
    box.innerHTML = `
      <p class="muted" style="margin:0">Save your collection in your own private GitHub repository, so it's the same on all your devices and GitHub keeps every version. The token is stored only in this browser.</p>
      <details class="guide" ${sync ? "" : "open"}>
        <summary>Step-by-step guide (about 5 minutes, once)</summary>
        <div class="gstep"><span class="gn">1</span><div><b>Make a private repository for your cards</b>
          <p>Open <a href="https://github.com/new?name=setdex-data&visibility=private&description=Private%20save%20data%20for%20SetDex" target="_blank" rel="noopener">github.com/new</a>. Name it <code>setdex-data</code>, choose <b>Private</b>, tick <b>Add a README file</b> and press <b>Create repository</b>.</p>
          <p class="faint">Already made it? Skip this step.</p></div></div>
        <div class="gstep"><span class="gn">2</span><div><b>Make a token (a key that only opens that one repository)</b>
          <p>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> and fill in:</p>
          <ul class="glist">
            <li><b>Token name:</b> <code>SetDex</code></li>
            <li><b>Expiration:</b> pick <b>1 year</b> (or Custom). When it runs out, make a new one.</li>
            <li><b>Repository access:</b> <b>Only select repositories</b> → <b>Select repositories</b> → <code>setdex-data</code></li>
            <li><b>Permissions:</b> click <b>+ Add permissions</b>, search for <b>Contents</b> and tick it. It's added as <i>Read-only</i>: click that and change it to <b>Read and write</b>.</li>
            <li>GitHub adds <b>Metadata: Read-only</b> by itself. That's fine. Don't add anything else.</li>
          </ul>
          <p>Press <b>Generate token</b> and copy it right away. GitHub only shows it once. It starts with <code>github_pat_</code>.</p></div></div>
        <div class="gstep"><span class="gn">3</span><div><b>Connect</b>
          <p>Fill in the two boxes below and press <b>Connect</b>. Do this once on each phone or computer, using the same token or a new one.</p></div></div>
        <div class="gtips"><b>If it doesn't work</b>
          <ul class="glist">
            <li><i>"didn't accept the token"</i>: the token was copied wrong or has expired. Make a new one.</li>
            <li><i>"couldn't find the repository"</i>: check the name below, and that <code>setdex-data</code> is ticked under Repository access.</li>
            <li><i>"isn't allowed to change"</i>: Contents is still Read-only. Edit the token on GitHub and set it to Read and write.</li>
          </ul></div>
      </details>
      <label>Data repository<input class="input" id="srepo" placeholder="your-name/setdex-data" value="${esc(owner ? owner + "/setdex-data" : "")}" autocomplete="off" spellcheck="false"></label>
      <label>Token<input class="input" id="stoken" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></label>
      <div><button class="btn primary" id="sconn">Connect</button></div>`;
    document.getElementById("sconn").onclick = async ev => {
      const repo = document.getElementById("srepo").value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, "");
      const token = document.getElementById("stoken").value.trim();
      if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ toast("Write the repository as name/setdex-data"); return; }
      if(!token){ toast("Paste your token first"); return; }
      ev.target.disabled = true; ev.target.textContent = "Checking…";
      sync = {repo, token};
      try{
        const r = await ghFetch(`/repos/${repo}`);
        if(!r.ok) throw new Error(await ghError(r));
        const j = await r.json();
        if(!j.private && !confirm(`${repo} is PUBLIC, so anyone could see your collection. Use it anyway?\n\nBetter: make it private in the repository's Settings first.`)) throw new Error("");
        if(j.permissions && !j.permissions.push) throw new Error("The token can read but not change this repository. Give it Contents: Read and write.");
        lsSet("setdex-sync", sync);
        drawSyncInfo();
        const ok = await syncNow();
        toast(ok ? "Connected. Your collection is synced." : "Connected, but the first sync had a problem");
        drawSyncInfo();
      }catch(e){
        sync = null;
        if(e.message) toast(e.message === "Failed to fetch" ? "Couldn't reach GitHub" : e.message);
        ev.target.disabled = false; ev.target.textContent = "Connect";
      }
    };
  }
}

/* ---------- install as an app + offline ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; drawInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("SetDex is installed"); drawInstall(); });
const canOffline = () => "serviceWorker" in navigator && location.protocol !== "file:" && window.isSecureContext;
const isInstalled = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function drawInstall(){
  const box = document.getElementById("installbox"); if(!box) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const offline = canOffline();
  if(isInstalled()){ box.innerHTML = `<p style="margin:0">✓ SetDex is installed on this device${offline ? " and works offline" : ""}.</p>`; return; }
  if(!canOffline()){ box.innerHTML = `<p class="muted" style="margin:0">Open the online version to install it: <a href="${esc(APP_URL)}">${esc(APP_URL)}</a></p>`; return; }
  box.innerHTML = `<p class="muted" style="margin:0">Install SetDex to get an app icon on your home screen. It opens full screen and works without internet. Cards you've seen before keep their pictures.</p>
    ${installEvt ? `<div><button class="btn primary" id="instbtn">Install SetDex</button></div>` : ios
      ? `<ol class="glist"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (the square with an arrow).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>`
      : `<ol class="glist"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li></ol>`}`;
  const b = document.getElementById("instbtn");
  if(b) b.onclick = async () => { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; drawInstall(); };
}
if(canOffline()){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ---------- router ---------- */
function route(){
  loadToken++;
  if(dlg.open) dlg.close();
  const [view, arg, arg2] = (location.hash.replace(/^#\/?/, "") || "sets").split("/");
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === (view === "set" ? "sets" : ["binder", "friend"].includes(view) ? "trade" : view)));
  window.scrollTo(0, 0);
  if(view === "set" && arg) viewSet(decodeURIComponent(arg), arg2 ? decodeURIComponent(arg2) : "main");
  else if(view === "collection") viewCollection();
  else if(view === "search") viewSearch();
  else if(view === "trade") viewTrade(arg);
  else if(view === "binder" && arg) openBinderCode(arg);
  else if(view === "friend" && arg){ const f = col.friends[decodeURIComponent(arg)]; if(f) viewBinder(f.b, decodeURIComponent(arg)); else location.replace("#/trade/friends"); }
  else if(view === "connect" && arg) handleConnect(arg);
  else if(view === "settings") viewSettings();
  else viewSets();
}
window.addEventListener("hashchange", route);
route();
if(sync){ setSync("busy"); syncNow(); }
/* fetch exchange rates in the background; redraw once if this is the first time */
refreshRates().then(changed => { if(changed && col.settings.currency !== "EUR" && !dlg.open && !/settings/.test(location.hash)) route(); });
</script>
